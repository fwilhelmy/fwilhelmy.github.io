<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1931">
  <title>Félix Wilhelmy | Résumé / CV</title>
  <meta name="description" content="View Félix Wilhelmy's résumé in English or French.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Félix Wilhelmy | Résumé / CV">
  <meta property="og:description" content="View my résumé in English or French.">
  <meta property="og:url" content="https://fwilhelmy.github.io/">

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 70% 65% at 50% 34%, rgba(38, 72, 121, .38), transparent 80%),
        #0a1931;
      color: #f8fafc;
      text-align: center;
    }
    main {
      width: min(100%, 570px);
      padding: clamp(36px, 7vw, 64px) clamp(22px, 6vw, 54px);
      border: 1px solid rgba(213, 225, 243, .14);
      border-radius: 18px;
      background: rgba(255, 255, 255, .035);
      box-shadow: 0 28px 85px rgba(0, 0, 0, .19);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #9cb3d5;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.14;
    }
    .rule {
      width: 46px;
      height: 2px;
      margin: 25px auto 22px;
      border-radius: 2px;
      background: #91b2e1;
    }
    .description {
      margin: 0 0 30px;
      color: #c4d0e1;
      font-size: .98rem;
      line-height: 1.65;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-width: 192px;
      min-height: 49px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-size: .96rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color .15s, border-color .15s, transform .15s;
    }
    a:first-child {
      background: #edf3fc;
      border-color: #edf3fc;
      color: #122742;
    }
    a:hover {
      background: rgba(255, 255, 255, .19);
      border-color: rgba(255, 255, 255, .60);
      transform: translateY(-2px);
    }
    a:first-child:hover {
      background: #ffffff;
      border-color: #ffffff;
    }
    a:focus-visible {
      outline: 3px solid #a8c7ff;
      outline-offset: 4px;
    }
    .arrow { font-size: 1.05rem; font-weight: 500; }
    .note {
      margin: 24px 0 0;
      color: #9cb3d5;
      font-size: .78rem;
    }
    @media (max-width: 480px) {
      .links { flex-direction: column; }
      a { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
      a:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Résumé / CV</p>
    <h1>Félix Wilhelmy</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="description">Choose a language to view my résumé.</p>
    <nav class="links" aria-label="Résumé language">
      <a href="fwil_resume_ml_eng.pdf" target="_blank" rel="noopener noreferrer" lang="en">
        English résumé <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="fwil_resume_ml_fr.pdf" target="_blank" rel="noopener noreferrer" lang="fr">
        CV en français <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <p class="note">PDF · Opens in a new tab</p>
  </main>
</body>
</html>
